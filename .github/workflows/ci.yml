name: Kiểm thử

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm.cmd ci
      - run: npx.cmd playwright install chromium
      - run: npm.cmd test
      - run: npm.cmd run test:browser
      - run: npm.cmd run pack
